name: Playwright Tests
on:
  push:
  pull_request:
    branches: [main]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    # Same image as `npm run test:visual:update-linux`, so screenshots match the committed Linux baselines.
    # Bump the tag together with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=list,blob
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1
  merge-reports:
    needs: [test]
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: all-blob-reports
      - name: Merge the shard reports
        run: npx playwright merge-reports --config playwright.merge.config.ts ./all-blob-reports
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      # Allure's trend charts need the previous runs' history. A new cache entry is saved every run;
      # the restore key picks the most recent one. Branch runs can read main's entries, not the reverse.
      # Restore and save are separate steps so the history is saved even when an earlier step failed.
      - name: Restore Allure history
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v6
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: allure-history-
      - name: Build the Allure report
        if: ${{ !cancelled() }}
        run: |
          npx allure generate allure-results --history-limit 20
          echo "Allure history entries: $(wc -l < allure-history/history.jsonl)"
      - name: Save Allure history
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
  automationexercise:
    # The second target app, a public third-party site that is sometimes overloaded (HTTP 503).
    # Its result is shown on every run but never fails the workflow or the badge.
    continue-on-error: true
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run the automationexercise.com suite
        run: npm run test:automationexercise
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-automationexercise
          path: playwright-report-automationexercise/
          retention-days: 30
  publish-reports:
    # Puts the latest main run's reports at https://shop-flow-wine.vercel.app, failing tests included:
    # that's when the report matters most. Branch and pull request runs keep theirs as artifacts only.
    needs: [merge-reports, automationexercise]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # Hosting is a convenience: a Vercel outage shows here but never fails the workflow or the badge.
    continue-on-error: true
    # One deploy at a time, so an older run can't finish last and replace a newer run's reports.
    concurrency:
      group: publish-reports
      cancel-in-progress: false
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Not secrets: they name the Vercel team and project, and grant nothing without the token.
      VERCEL_ORG_ID: team_FA2BelJc5gSqJqEX3XOPErwP
      VERCEL_PROJECT_ID: prj_SNDdWPTsm7Qsz48VatAshJoZ1yER
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # A report whose job failed before uploading is missing; the landing page lists it as unavailable.
      - uses: actions/download-artifact@v8
        with:
          pattern: '{playwright-report,allure-report,playwright-report-automationexercise}'
          path: reports
      - name: Build the report site
        run: node scripts/build-report-site.js reports
      - name: Deploy to Vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::Reports not published: add a Vercel token as the repository secret VERCEL_TOKEN."
            exit 0
          fi
          npx --yes vercel@59.3.0 deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
