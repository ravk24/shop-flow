name: Playwright Tests
on:
  push:
  pull_request:
    branches: [main]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    # Same image as `npm run test:visual:update-linux`, so screenshots match the committed Linux baselines.
    # Bump the tag together with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=list,blob
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1
  merge-reports:
    needs: [test]
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: all-blob-reports
      - name: Merge the shard reports
        run: npx playwright merge-reports --config playwright.merge.config.js ./all-blob-reports
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      # Allure's trend charts need the previous runs' history. A new cache entry is saved every run;
      # the restore key picks the most recent one. Branch runs can read main's entries, not the reverse.
      # Restore and save are separate steps so the history is saved even when an earlier step failed.
      - name: Restore Allure history
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v6
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: allure-history-
      - name: Build the Allure report
        if: ${{ !cancelled() }}
        run: |
          npx allure generate allure-results --history-limit 20
          echo "Allure history entries: $(wc -l < allure-history/history.jsonl)"
      - name: Save Allure history
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
