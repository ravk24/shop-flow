name: Playwright Tests
on:
  push:
  pull_request:
    branches: [main]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    # Same image as `npm run test:visual:update-linux`, so screenshots match the committed Linux baselines.
    # Bump the tag together with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run Playwright tests
        # Without GITHUB_ACTIONS, Playwright adds no CI metadata (commit and run links), so the public
        # report shows no Metadata box. CI stays set, so retries, workers and failOnFlakyTests are unchanged.
        run: env -u GITHUB_ACTIONS npx playwright test --shard=${{ matrix.shard }}/4 --reporter=list,blob
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1
  merge-reports:
    needs: [test]
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: all-blob-reports
      - name: Merge the shard reports
        run: npx playwright merge-reports --config playwright.merge.config.ts ./all-blob-reports
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
  publish-reports:
    # Puts the latest main run's Playwright report at https://shop-flow-wine.vercel.app, failing tests included:
    # that's when the report matters most. Branch and pull request runs keep theirs as artifacts only.
    needs: [merge-reports]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # Hosting is a convenience: a Vercel outage shows here but never fails the workflow or the badge.
    continue-on-error: true
    # One deploy at a time. This doesn't order them: a waiting deploy is dropped when a newer one arrives
    # (that run shows as cancelled), and the step below skips any run that is no longer main's head.
    concurrency:
      group: publish-reports
      cancel-in-progress: false
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    env:
      # Not secrets: they name the Vercel team and project, and grant nothing without the token.
      VERCEL_ORG_ID: team_FA2BelJc5gSqJqEX3XOPErwP
      VERCEL_PROJECT_ID: prj_SNDdWPTsm7Qsz48VatAshJoZ1yER
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # If the merge job failed before uploading the report, the build step finds nothing and fails.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: playwright-report
          path: reports/playwright-report
      - name: Build the report site
        run: node scripts/build-report-site.js reports
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::Reports not published: add a Vercel token as the repository secret VERCEL_TOKEN."
            exit 0
          fi
          # A slower older run, or a re-run of an old one, must not replace newer reports.
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::Not published: main has moved on to ${head:0:7}, whose run publishes its own reports."
            exit 0
          fi
          npx --yes vercel@59.3.0 deploy --prebuilt --prod --yes
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
